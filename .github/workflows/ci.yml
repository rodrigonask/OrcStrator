name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: CI reads the code and nothing else. Every
# third-party action below is pinned to a full commit SHA (the tag it was is
# in the comment); Dependabot's github-actions updates keep the pins fresh.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The Node major the Windows installer bundles. Native modules are
          # ABI-bound, so CI must test against the Node users actually run
          # (22 = ABI 127).
          node-version: 22
          cache: npm

      # better-sqlite3 ships prebuilds for Node 22 on both platforms;
      # if a prebuild is ever missing, node-gyp falls back to a source
      # build (ubuntu runners include build-essential, windows includes MSVC).
      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      - name: Typecheck client
        run: npx tsc --noEmit
        working-directory: client

      - name: Build client
        run: npx vite build
        working-directory: client

      # Every suite in one runner: shared/test and server/test, each file in its own
      # process against its own temp database, plus the compaction hook and stream-parser
      # suites. A new *.test.ts file is picked up without touching this workflow. The hook test
      # gives the spawned hook its own scratch home and telemetry file, so nothing here writes
      # into a real data dir.
      - name: Unit and route tests
        run: npm run test:unit

      # Every other root test:* script, by name, the same set the public
      # snapshot verifier runs (test:unit above covers their files too).
      - name: Schedule tests
        run: npm run test:schedule

      - name: Slug tests
        run: npm run test:server

      # Known advisories in runtime dependencies: a hard gate since the runtime advisories
      # were cleared (0 at that merge). A new high advisory in something users run fails the build; dev-only
      # tooling advisories are left to Dependabot.
      - name: Dependency audit (runtime, high and above)
        run: npm audit --omit=dev --audit-level=high

  # The Windows launcher and release tooling (PowerShell 5.1, like users run).
  installer-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and NO stored credentials (the updater tests must see
          # GitHub unauthenticated).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The updater tests fetch from origin and need a tracking branch. Point
      # origin at a local bare copy so that works with no credentials and no
      # network, in this repo and in any fork.
      - name: Give the checkout a branch with a local upstream
        shell: powershell
        run: |
          $bare = Join-Path $env:RUNNER_TEMP 'origin.git'
          git checkout -q -B ci-local
          git init -q --bare $bare
          git remote set-url origin $bare
          git push -q origin ci-local
          if ($LASTEXITCODE -ne 0) { throw 'could not push to the local upstream' }
          git fetch -q origin
          git branch --set-upstream-to=origin/ci-local ci-local
          if ($LASTEXITCODE -ne 0) { throw 'could not track origin/ci-local' }
          git rev-parse --abbrev-ref '@{u}'
      - name: Launcher and release tests
        shell: powershell
        run: |
          $failed = @()
          # Every launcher test runs, whatever the history depth: the updater
          # tests build the history they need in their own scratch clones.
          # unit-*.ps1 are the pure ones (no install, no app start): workflow
          # rules, old-launcher compatibility, extracted launcher functions.
          $tests = @(Get-ChildItem installer -Filter 'test-*.ps1') + @(Get-ChildItem installer/release -Filter 'test-*.ps1') +
                   @(Get-ChildItem installer -Filter 'unit-*.ps1') + @(Get-ChildItem installer/release -Filter 'unit-*.ps1')
          foreach ($t in $tests) {
            Write-Host "::group::$($t.Name)"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $t.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            Write-Host "$($t.Name): exit $code"
            if ($code -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count) { throw "Failed: $($failed -join ', ')" }
      - name: Worker tests
        run: npm test
        working-directory: worker
